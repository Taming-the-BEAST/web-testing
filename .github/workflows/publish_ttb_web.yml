name: Publish TTB website

on:
  workflow_dispatch:

  

jobs:

  build_web_site:
    permissions: write-all
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/taming-the-beast/ttb-web-build-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      volumes: 
        - ${{ github.workspace }}:/app
    steps:
      - name: Check out the blotter repo
        uses: actions/checkout@v5
        with:
          repository: Taming-the-BEAST/blotter_test
          token: ${{secrets.GITHUB_TOKEN}}
          path: blotter
      - name: Check out the web repo
        uses: actions/checkout@v5
        with:
          path: website
          
      - name: Fetch tutorials
        run: |
          cd blotter
          npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and index the site
        run: |
          cd blotter
          npm run build
        env:
          BASEURL: /web-testing
          
      - name: Verify _site was created
        run: |
          if [ ! -d "blotter/_site" ] || [ -z "$(ls -A blotter/_site)" ]; then
            echo "ERROR: _site directory is missing or empty"
            exit 1
          fi
          echo "Site built successfully"

      - name: Push changes to site
        run: |
          cp -RT blotter/_site/ website/
          cd website
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "updated for gh action"
          git push
          
      
          
        
      
